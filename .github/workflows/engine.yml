name: Engine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./lib/attnsync
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./lib/attnsync
